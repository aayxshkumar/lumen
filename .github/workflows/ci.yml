name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-24.04
            cxx: g++
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: linux-clang-release
            os: ubuntu-24.04
            cxx: clang++
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: linux-gcc-asan-ubsan
            os: ubuntu-24.04
            cxx: g++
            flags: -DCMAKE_BUILD_TYPE=Debug -DLUMEN_SANITIZERS=address,undefined
          - name: macos-clang-ubsan
            os: macos-15
            cxx: clang++
            flags: -DCMAKE_BUILD_TYPE=Debug -DLUMEN_SANITIZERS=undefined
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j 4
      - name: Unit tests and program suite
        # Reference counting leaks every closure cycle (README "Memory"), and
        # LeakSanitizer reports it. Leak checks stay off until the tracing GC
        # lands; turning them back on is that milestone's done check. ASan
        # still checks everything else (use-after-free, overflows).
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure
      - name: Benchmarks (smoke run)
        if: matrix.name == 'linux-gcc-release'
        run: python3 tools/bench.py --lumen build/lumen --runs 1
